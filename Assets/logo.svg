<svg xmlns="http://www.w3.org/2000/svg" viewBox="120 100 265 265" width="100%" height="100%">
  <style>
    /* Default / Light Mode Color Cycle */
    @keyframes cycle-stop-1 {
      0%, 100% { stop-color: #0A1128; } /* Deep Navy */
      20% { stop-color: #1D4ED8; }      /* Cobalt */
      40% { stop-color: #14B8A6; }      /* Teal */
      60% { stop-color: #7C3AED; }      /* Violet */
      80% { stop-color: #FB7185; }      /* Coral */
    }

    @keyframes cycle-stop-2 {
      0%, 100% { stop-color: #1D4ED8; } /* Cobalt */
      20% { stop-color: #14B8A6; }      /* Teal */
      40% { stop-color: #7C3AED; }      /* Violet */
      60% { stop-color: #FB7185; }      /* Coral */
      80% { stop-color: #0A1128; }      /* Deep Navy */
    }

    #gradient-stop-1 {
      animation: cycle-stop-1 12s linear infinite;
    }
    #gradient-stop-2 {
      animation: cycle-stop-2 12s linear infinite;
    }

    /* 
      Dark Mode Overrides: 
      Replaces Deep Navy with a vibrant cobalt blue to ensure high contrast on dark themes.
    */
    @media (prefers-color-scheme: dark) {
      @keyframes cycle-stop-1 {
        0%, 100% { stop-color: #1E40AF; } /* Brighter Dark Blue */
        20% { stop-color: #2563EB; }      /* Vibrant Cobalt */
        40% { stop-color: #06B6D4; }      /* Bright Teal */
        60% { stop-color: #8B5CF6; }      /* Bright Violet */
        80% { stop-color: #F43F5E; }      /* Bright Coral */
      }

      @keyframes cycle-stop-2 {
        0%, 100% { stop-color: #2563EB; }
        20% { stop-color: #06B6D4; }
        40% { stop-color: #8B5CF6; }
        60% { stop-color: #F43F5E; }
        80% { stop-color: #1E40AF; }
      }
    }
  </style>

  <defs>
    <linearGradient id="css-prismatic-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop id="gradient-stop-1" offset="0%" />
      <stop id="gradient-stop-2" offset="100%" />
    </linearGradient>
  </defs>

  <g stroke="url(#css-prismatic-gradient)" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="14">
    
    <!-- 1. Eyebrow -->
    <path d="M 140,165 C 190,150 310,150 360,165" />

    <!-- 
      2. Concentric Pupil (Truly Hollow & Transparent)
      Using a stroke of width 9 around a radius of 20.5 creates an outer boundary 
      at 25 and an inner boundary at 16, leaving the center perfectly transparent.
    -->
    <circle cx="250" cy="215" r="20.5" stroke="url(#css-prismatic-gradient)" stroke-width="9" fill="none" />
    <circle cx="250" cy="215" r="9" fill="url(#css-prismatic-gradient)" stroke="none" />

    <!-- 3. Tapered Left Chevron (Behind Eyelid) -->
    <path d="M 218,244 V 335 L 250,270" />

    <!-- 4. Aligned Right Spiral (Behind Eyelid) -->
    <path d="M 250,250 C 270,295 305,335 345,315 C 372,295 378,252 352,234 C 332,220 314,238 324,256 C 332,270 346,262 342,254" />

    <!-- 5. Upper Eyelid & Aligned End-Tabs -->
    <path d="M 135,215 H 168 C 195,172 305,172 332,215 H 365" />

    <!-- 6. Lower Eyelid (Drawn last to mask joints) -->
    <path d="M 168,215 C 195,258 305,258 332,215" />

  </g>
</svg>
